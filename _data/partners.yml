- name: Felicity Wilde Charitable Trust
  headline: false
  logo: /assets/uploads/2025/11/68-17e63da1d37a2f7fae3eb84515bbee11_Zedra_Logo.png-300x171.webp
  blurb: Felicity Wilde Charitable Trust, looked after by Zedra, has generously given Keep Me Breathing our first VENTO Project Capital grant. VENTO is our wearable CO2 monitor, which represents stage one of our three-stage breathing pacemaker build for CCHS patents. VENTO also has scope to be of significant benefit to patients with other breathing conditions, such as acute asthma.
