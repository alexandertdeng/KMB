<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="icon" href="{{ '/assets/uploads/2022/09/KMB-Blue-icon-RGB-150x150.png' | relative_url }}" sizes="32x32">
  <link rel="icon" href="{{ '/assets/uploads/2022/09/KMB-Blue-icon-RGB-300x300.png' | relative_url }}" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ '/assets/uploads/2022/09/KMB-Blue-icon-RGB-300x300.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/kmb.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% feed_meta %}
</head>
<body class="kmb-home{% if page.body_class %} {{ page.body_class }}{% endif %}">
  <a class="kmb-skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  {% unless page.hide_fab %}{% include donate-fab.html %}{% endunless %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
